# Builds the companion plugin for macOS and Windows and attaches the zips to a
# GitHub Release. The web app's download modal links at
# releases/latest/download/rtc-audio-bridge-{macos,windows}.zip, so the asset
# names below are load-bearing - changing one means changing PluginDownload.tsx.
name: Build companion plugin

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:      # build without tagging, to check the matrix still works

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Cache the fetched JUCE / libdatachannel / libFLAC trees; they dominate
      # the build time and only change when the pinned tags do.
      - uses: actions/cache@v4
        with:
          path: plugin/build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      # Release builds are universal on macOS: the runners are arm64, so a
      # default build produces an arm64-only binary that silently will not load
      # on any Intel Mac. Costs roughly double the macOS build time.
      - name: Configure
        working-directory: plugin
        # COPY_PLUGINS=OFF: the local build installs into the user's plug-in
        # folders, which is wrong (and can fail) on a CI runner.
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGINS=OFF
          ${{ matrix.name == 'macos' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}

      - name: Build
        working-directory: plugin
        run: cmake --build build --config Release

      # The checks that pin the wire format and the resampler. If these fail the
      # binaries are not worth shipping.
      - name: Run checks
        working-directory: plugin
        shell: bash
        run: |
          find build -name 'flac_selfcheck*' -type f -perm -u+x -exec {} \;
          find build -name 'resampler_check*' -type f -perm -u+x -exec {} \;

      - name: Package
        working-directory: plugin
        shell: bash
        run: |
          mkdir -p dist
          root=$(find build/DawBridge_artefacts -maxdepth 1 -type d -name Release)

          # Copy ONLY the things a user installs, flattened to the top level.
          # The artefacts tree also holds the shared static lib and, on MSVC,
          # .exp/.lib linker leftovers next to the plug-in - none of which
          # belong in a download.
          for item in "$root"/AU/*.component \
                      "$root"/VST3/*.vst3 \
                      "$root"/Standalone/*.app \
                      "$root"/Standalone/*.exe; do
            [ -e "$item" ] && cp -R "$item" dist/
          done

          echo "packaged:"; ls -1 dist/
          # Fail loudly rather than shipping an empty or junk-filled zip.
          [ -n "$(ls -A dist)" ] || { echo "nothing packaged"; exit 1; }
          if ls dist/*.exp dist/*.lib dist/*.a >/dev/null 2>&1; then
            echo "build artefacts leaked into the package"; exit 1
          fi

          cd dist
          7z a -tzip "../rtc-audio-bridge-${{ matrix.name }}.zip" ./* || \
            zip -r "../rtc-audio-bridge-${{ matrix.name }}.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: rtc-audio-bridge-${{ matrix.name }}
          path: plugin/rtc-audio-bridge-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          body: |
            Companion plugin for streaming DAW audio into an rtc-audio session.

            - **macOS**: AU, VST3 and a standalone app
            - **Windows**: VST3 and a standalone app

            Both are unsigned. macOS will need you to allow the app under
            System Settings > Privacy & Security on first run.
